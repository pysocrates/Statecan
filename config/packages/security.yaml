security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_OPERATOR, ROLE_USER]
        ROLE_OPERATOR: ROLE_USER
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        agent_api:
            request_matcher: App\Security\AgentApiRequestMatcher
            stateless: true
            access_token:
                token_handler: App\Security\AgentTokenHandler
                failure_handler: App\Security\AgentAuthenticationResponse
        main:
            entry_point: App\Security\AgentAuthenticationResponse
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
    access_control:
        - { path: ^/api/v1, roles: [ROLE_AGENT, ROLE_USER] }
        - { path: ^/(login|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
