services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: statecan
      MYSQL_USER: statecan
      MYSQL_PASSWORD: statecan_local
      MYSQL_ROOT_PASSWORD: statecan_root_local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database_data:
